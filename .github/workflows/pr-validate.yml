name: PR Validation

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Restore Dev Hub auth URL
        run: echo "${{ secrets.SF_AUTH_URL }}" > authfile.txt

      - name: Auth to Dev Hub
        run: sf org login sfdx-url -f authfile.txt -a devhub --set-default-dev-hub

      - name: Create scratch org
        run: sf org create scratch -f config/project-scratch-def.json -a ciOrg -d -y 1 --wait 15

      - name: Deploy source
        run: sf project deploy start -o ciOrg

      - name: Run Apex tests
        run: sf apex run test -o ciOrg -c -r human --wait 15 -y

      - name: Delete scratch org
        if: always()
        run: sf org delete scratch -o ciOrg -p